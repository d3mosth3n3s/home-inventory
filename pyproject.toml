[project]
name = "home-inventory"
version = "1.0.0"
dependencies = [
    "fastapi",
    "python-multipart",
    "Pillow",
    "google-cloud-vision",
    "google-genai",
    "psycopg2-binary",
]

[project.optional-dependencies]
local = [
    "uvicorn[standard]",
    "streamlit",
    "streamlit-drawable-canvas",
    "pandas",
    "numpy",
]

[tool.vercel]
entrypoint = "backend.app:app"